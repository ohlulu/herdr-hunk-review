name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Extract changelog section
        # The release body is the changelog section whose heading matches the
        # tag (leading v stripped). No matching heading -> red workflow and no
        # release, never a published release with an empty body.
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" {found=1; next}
            /^## \[/ && found {exit}
            found {print}
          ' CHANGELOG.md > /tmp/notes.md
          test -s /tmp/notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md

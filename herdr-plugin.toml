id = "herdr-hunk-review"
name = "Hunk Review"
version = "0.3.0"
min_herdr_version = "0.8.0"
description = "Pick a git review target in a split pane, view it in hunk, and draft inline review notes into the neighboring agent pane"
platforms = ["linux", "macos"]

# The pane command's cwd is the --cwd passed at open time (the repo under
# review), so the script must be located via $HERDR_PLUGIN_ROOT (DEC-003).
[[panes]]
id = "picker"
title = "Hunk Review"
placement = "split"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/scripts/hunk_review.py\" picker"]

# Actions run with cwd = plugin root, so relative script paths work.
# Bind in ~/.config/herdr/config.toml:
#   [[keys.command]]
#   key = ["prefix+alt+h", "ctrl+alt+shift+h"]
#   type = "plugin_action"
#   command = "herdr-hunk-review.review"

[[actions]]
id = "review"
title = "Open hunk review picker"
contexts = ["global"]
command = ["python3", "scripts/hunk_review.py", "open-picker"]

[[actions]]
id = "send-notes"
title = "Send hunk notes to agent"
contexts = ["global"]
command = ["python3", "scripts/hunk_review.py", "send-notes"]
